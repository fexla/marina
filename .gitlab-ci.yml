# Marina GitLab CI · 多平台打包 + 发布(GitLab 先发,GitHub 可选同步)
#
# 触发: push tag v* → quality → build(linux 原生自动 / windows 手动) → publish
# 分支 feat/* 推送会生成 build:linux 手动任务 —— 不打 tag 就能验证构建管线全链路
# 对应: docs/打包发布流程.md §4、scripts/release.mjs、scripts/publish-release.mjs
#
# 自建 GitLab 前置条件(一次性):
#   1. Linux runner: FEX(标签 marina-linux,shell executor,用户级 systemd 服务)。
#      宿主机需 Node ≥ 20、g++/make/python3(node-pty 编译);不需要 Docker。
#   2. Windows runner(标签 marina-windows)尚未注册 —— build:windows 在 tag
#      流水线里是手动任务;publish 不依赖它(Linux 先发)。Windows runner 就绪后
#      把该 job 改回自动触发,或手动跑 job 后重跑 publish 幂等补传(按 sha256 比对)。
#   3. Settings → CI/CD → Variables 配置(**项目级**,不是 job 级):
#      - GITLAB_TOKEN       (必填;project access token,scope 需含 api + write_repository)
#                           ↑ Generic Package 上传与 Release 创建都靠它。CI_JOB_TOKEN
#                             权限不足,不能替代(脚本虽保留 JOB-TOKEN 兼容,但不建议依赖)
#      - GH_TOKEN           (可选,GitHub classic PAT repo scope;不配则只发 GitLab)
#      - GITHUB_OWNER / GITHUB_REPO  (可选,默认 fexla / marina)
#      - ELECTRON_MIRROR    (可选,默认 npmmirror)
#      注:GITLAB_URL / GITLAB_PROJECT_ID 由 CI 预定义变量映射,无需手工配置
#   4. package.json version 必须与 tag 一致(tag = v${version}),CI 会拦
#
# 设计要点:
#   - quality 与 build 分离:build 阶段跳过 typecheck/lint/tests,避免双跑
#   - Windows / Linux 各自独立 job,互不共享 node_modules(ISO-1 教训)
#   - Linux 原生构建(FEX shell runner),与 docs/打包发布流程.md §3.4.1 手工流程
#     同路径。electron-builder 传 --config.npmRebuild=false:npm ci 的 postinstall
#     已编好 pty.node,内置 rebuild 在 FEX 上会挂起(实测),显式关掉
#   - publish 只依赖 build:linux 的产物(Linux 先发):tag 推送即发 deb/AppImage;
#     Windows 包就绪后由 publish-release.mjs 增量补传(远端已有且 sha256 一致的
#     文件自动跳过,同名不同内容先删后传)

stages:
  - quality
  - build
  - publish

variables:
  GIT_DEPTH: "0"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  # 缓存 key 按 lockfile,跨 job 共享 node_modules 时注意平台 — 本项目故意不跨平台共享
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true

# ---------------------------------------------------------------------------
# quality · 在 Linux runner 上跑 typecheck / lint / test(构建门禁)
# ---------------------------------------------------------------------------
quality:linux:
  stage: quality
  tags:
    - marina-linux
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - node -v && npm -v
    - npm ci
  script:
    - npm run typecheck
    - npm run lint
    - npm run lint:css
    - npm test
  cache:
    key: "npm-linux-$CI_JOB_NAME"
    paths:
      - .npm

# ---------------------------------------------------------------------------
# build:windows · nsis + portable
# 需要 Windows runner(tag: marina-windows)。shell 或 docker-windows executor 均可,
# 但必须装 Node 20、Python 3、VS Build Tools 2022(node-pty)。
# Windows runner 未就绪期间是 tag 流水线里的手动任务,不阻塞 pipeline 完成;
# 就绪后去掉 when/allow_failure 恢复自动触发。
# ---------------------------------------------------------------------------
build:windows:
  stage: build
  tags:
    - marina-windows
  needs:
    - job: quality:linux
      artifacts: false
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
      allow_failure: true
  variables:
    GIT_CLEAN_FLAGS: "ffdx"
  before_script:
    - node -v
    - |
      $tag = "${CI_COMMIT_TAG}"
      $ver = $tag.TrimStart("v")
      $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
      if ($pkg -ne $ver) {
        Write-Error "tag $tag 与 package.json version $pkg 不一致 — 先 bump/version 再打 tag"
        exit 1
      }
      Write-Host "version OK: $ver"
  script:
    - npm ci
    # quality 已过,build 阶段跳过重复检查;verify --strict 仍强制(ISO-1 门禁)
    - npm run release:win -- --strict --skip-typecheck --skip-lint --skip-tests
  after_script:
    - if (Test-Path "release") { Get-ChildItem -Recurse release | Select-Object FullName, Length | Format-Table -AutoSize }
  artifacts:
    name: "marina-win-$CI_COMMIT_TAG"
    when: on_success
    expire_in: 30 days
    paths:
      - release/
    exclude:
      - release/**/*-unpacked/**
      - release/**/*.pdb

# ---------------------------------------------------------------------------
# build:linux · deb + AppImage(FEX shell runner 原生构建,无 Docker)
# 两条触发路径:
#   - tag v*:自动,发布链路的一环(tag 与 package.json version 一致性在此拦截)
#   - feat/* 分支:手动任务(when: manual),供不打 tag 验证构建管线;
#     此时跳过 tag/version 一致性检查(分支上 version 尚未 bump 是常态)
# verify-artifacts --strict 是 ISO-1 门禁:扫 release/<v>/linux-unpacked/ 确认
# .node 全为 ELF、asar/shell-hooks 在位、体积在界内;失败则 job 失败,不进 publish。
# ---------------------------------------------------------------------------
build:linux:
  stage: build
  tags:
    - marina-linux
  needs:
    - job: quality:linux
      artifacts: false
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'
      when: manual
      allow_failure: true
  before_script:
    - node -v
    - |
      pkg=$(node -p "require('./package.json').version")
      if [ -n "$CI_COMMIT_TAG" ]; then
        tag="${CI_COMMIT_TAG#v}"
        if [ "$pkg" != "$tag" ]; then
          echo "ERROR: tag $CI_COMMIT_TAG 与 package.json version $pkg 不一致"
          exit 1
        fi
      fi
      echo "version: $pkg (tag: ${CI_COMMIT_TAG:-分支构建,跳过一致性检查})"
  script:
    - npm ci
    - npx electron-vite build
    - npx electron-builder --linux deb AppImage --x64 --config.npmRebuild=false
    - node scripts/verify-artifacts.mjs --version="$(node -p "require('./package.json').version")" --strict
  artifacts:
    name: "marina-linux-$CI_COMMIT_REF_SLUG"
    when: on_success
    expire_in: 30 days
    paths:
      - release/
    exclude:
      - release/**/*-unpacked/**
  cache:
    key: "npm-linux-$CI_JOB_NAME"
    paths:
      - .npm

# ---------------------------------------------------------------------------
# publish · Linux 先发:GitLab Generic Package + Release(GH_TOKEN 存在时同步 GitHub)
# 只依赖 build:linux 的产物 —— tag 推送即发布 deb/AppImage;Windows 包由
# build:windows(手动)产出后,重跑本 job 或本地 publish:release 幂等补传。
# ---------------------------------------------------------------------------
publish:release:
  stage: publish
  tags:
    - marina-linux
  needs:
    - job: build:linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  variables:
    # CI 预定义变量 → 脚本读的环境变量名映射。
    # 注意:不要在这里再写 GITLAB_TOKEN —— 项目级 CI/CD 变量会自动注入 job 环境,
    # job 级声明反而会覆盖它,自引用($GITLAB_TOKEN)展开后是空串,导致 publish 失败。
    GITLAB_URL: "$CI_SERVER_URL"
    GITLAB_PROJECT_ID: "$CI_PROJECT_ID"
  script:
    - node -v
    - |
      VER="${CI_COMMIT_TAG#v}"
      echo "publish Marina $VER"
      ls -la release/"$VER"/ || ls -laR release/ | head -100
    - node scripts/publish-release.mjs --version="$VER"
  # 不把 release 再 artifact 出去 — 已在 GitLab/GitHub 上
